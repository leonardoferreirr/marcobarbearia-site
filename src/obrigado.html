<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Abrindo o WhatsApp | Marco Barbearia</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Poppins;src:url(/assets/fonts/poppins-300.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:Poppins;src:url(/assets/fonts/poppins-500.woff2) format('woff2');font-weight:500;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0b0b0b;color:#f4f2ec;font:300 1rem/1.6 Poppins,Arial,sans-serif;text-align:center;padding:2rem 1.25rem}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.caixa{max-width:26rem}
.marca{height:110px;width:auto;margin:0 auto 2rem}
.roda{width:46px;height:46px;margin:0 auto 1.6rem;border-radius:50%;border:2px solid rgba(254,237,0,.2);border-top-color:#feed00;animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roda{animation-duration:3s}}
h1{font-weight:300;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.2;margin:0}
p{color:rgba(244,242,236,.66);margin:.8rem 0 2rem}
a.btn{display:inline-flex;align-items:center;gap:.6em;padding:1em 1.5em;border-radius:999px;background:#feed00;color:#111;font-weight:500;text-decoration:none;white-space:nowrap}
a.btn svg{width:1.2em;height:1.2em}
a.volta{display:block;margin-top:1.4rem;color:rgba(244,242,236,.6);font-size:.92rem}
</style>
</head>
<body>
<!--DEFS-->
<main class="caixa">
  <svg class="marca" viewBox="0 0 2742 1840" role="img" aria-label="Marco Barbearia"><use href="#logo"/></svg>
  <div class="roda" aria-hidden="true"></div>
  <h1 id="titulo">Estamos abrindo o seu WhatsApp</h1>
  <p>Se não abrir sozinho em alguns segundos, toque no botão abaixo.</p>
  <a class="btn" id="ir" href="https://wa.me/5534997267707"><!--WA-->Abrir o WhatsApp</a>
  <a class="volta" href="/">Voltar para o site</a>
</main>
<script>
(function () {
  // Cada unidade tem o próprio WhatsApp (mesmos números da página links.marcobarbearia.com.br).
  var UNIDADES = {
    vinhedos: { numero: '5534993370707', nome: 'Vinhedos, em Uberlândia' },
    container: { numero: '5534997267707', nome: 'Container, em Uberlândia' },
    brooklin: { numero: '5511989017679', nome: 'Brooklin, em São Paulo' },
    ironbarber: { numero: '5511939137414', nome: 'IronBarber by Marco, em São Paulo' }
  };
  var PRINCIPAL = '5534997267707';
  var c = (new URLSearchParams(location.search).get('c') || 'site').replace(/[^a-z0-9_-]/gi, '').slice(0, 30);
  var u = UNIDADES[c];
  var numero = u ? u.numero : PRINCIPAL;
  var msg = u ? 'Olá! Vim pelo site da Marco Barbearia e quero agendar um horário na unidade ' + u.nome + '.'
              : 'Olá! Vim pelo site da Marco Barbearia e quero agendar um horário.';
  var destino = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(msg);
  document.getElementById('ir').href = destino;

  // Pixel da Meta e Google Ads: registram o contato antes de sair da página.
  !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s) }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '519533885953931');
  fbq('track', 'PageView');
  fbq('track', 'Contact', { content_name: c });
  var g = document.createElement('script'); g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=AW-11189677758'; document.head.appendChild(g);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', 'AW-11189677758');
  // Para virar conversão no Google Ads: criar a ação no painel e trocar por gtag('event','conversion',{send_to:'AW-11189677758/RÓTULO'}).
  gtag('event', 'contato_whatsapp', { unidade: c });

  var partiu = false;
  function vai() { if (partiu) return; partiu = true; location.replace(destino); }
  setTimeout(vai, 1200);
})();
</script>
</body>
</html>
